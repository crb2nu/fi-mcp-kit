# Default values for fi-mcp-gateway.
replicaCount: 2

image:
  repository: registry.flexinfer.ai/libs/fi-mcp-gateway
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mcp-gateway.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Gateway specific configuration
config:
  hubToken: "" # Provide via --set config.hubToken or secret
  listen: ":8080"
  backendTemplate: "" # Default: ws://{server}:8080/ws
  registry:
    enabled: false
    existingConfigMap: "" # If empty and enabled=true, chart will create one from registryYaml
    key: registry.yaml
    registryYaml: "" # Inline registry.yaml (only used when enabled=true and existingConfigMap is empty)
