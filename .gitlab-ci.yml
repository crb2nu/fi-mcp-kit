# Go CI - Uses shared templates from platform/gitops
include:
  - project: 'platform/gitops'
    file: '/ci/templates/go.yml'

default:
  image: golang:1.25.5

stages: [lint, test, build]

lint:
  extends: .go-lint
  image: golang:1.25.5

test:
  extends: .go-test
  image: golang:1.25.5
  variables:
    CGO_ENABLED: "1"

build:cli:
  extends: .go-build
  image: golang:1.25.5
  script:
    - CGO_ENABLED=0 go build -ldflags="-s -w" -o fi-mcp ./cmd/fi-mcp
  artifacts:
    paths:
      - fi-mcp
    expire_in: 1 week
