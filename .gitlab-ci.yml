# Go CI - Uses shared templates from platform/gitops
include:
  - project: 'platform/gitops'
    file: '/ci/templates/go.yml'

default:
  image: golang:1.25.5

variables:
  GOPRIVATE: "gitlab.flexinfer.ai"
  GONOSUMDB: "gitlab.flexinfer.ai"
  IMAGE_REGISTRY: registry.harbor.lan
  GATEWAY_IMAGE_REPO: mcp/fi-mcp-gateway
  DOCKER_CONFIG: /kaniko/.docker

stages: [lint, test, build, deploy]

lint:
  extends: .go-lint
  image: golang:1.25.5
  before_script:
    - mkdir -p "$GOPATH" "$GOCACHE"
  script:
    - GOFLAGS=-mod=vendor go vet ./...

test:
  extends: .go-test
  image: golang:1.25.5
  before_script:
    - mkdir -p "$GOPATH" "$GOCACHE"
  variables:
    CGO_ENABLED: "1"
  script:
    - GOFLAGS=-mod=vendor go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
    - go install github.com/boumenot/gocover-cobertura@v1.4.0
    - $(go env GOPATH)/bin/gocover-cobertura < coverage.out > coverage.xml
    - GOFLAGS=-mod=vendor go tool cover -func=coverage.out

build:cli:
  extends: .go-build
  image: golang:1.25.5
  before_script:
    - mkdir -p "$GOPATH" "$GOCACHE"
  script:
    - CGO_ENABLED=0 GOFLAGS=-mod=vendor go build -ldflags="-s -w" -o fi-mcp ./cmd/fi-mcp
  artifacts:
    paths:
      - fi-mcp
    expire_in: 1 week

build:image:fi-mcp-gateway:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - mkdir -p "$DOCKER_CONFIG"
    - >
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}'
      "$IMAGE_REGISTRY" "$HARBOR_USERNAME" "$HARBOR_PASSWORD" > "$DOCKER_CONFIG/config.json"
    - export IMAGE="$IMAGE_REGISTRY/$GATEWAY_IMAGE_REPO"
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile.fi-mcp-gateway"
      --destination "$IMAGE:$CI_COMMIT_SHORT_SHA"
      --build-arg "CI_JOB_TOKEN=$CI_JOB_TOKEN"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        /kaniko/executor \
          --context "$CI_PROJECT_DIR" \
          --dockerfile "$CI_PROJECT_DIR/Dockerfile.fi-mcp-gateway" \
          --destination "$IMAGE:latest" \
          --build-arg "CI_JOB_TOKEN=$CI_JOB_TOKEN"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
