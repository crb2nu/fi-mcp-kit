# Go CI - Uses shared templates from platform/gitops
include:
  - project: 'platform/gitops'
    file: '/ci/templates/go.yml'

  - project: 'services/tech-radar'
    file: '/ci/radar.yml'
default:
  image: golang:1.25.5

variables:
  GOPROXY: "https://proxy.golang.org,direct"
  GOPRIVATE: "gitlab.flexinfer.ai"
  GONOSUMDB: "gitlab.flexinfer.ai"
  IMAGE_REGISTRY: registry.harbor.lan
  IMAGE_REGISTRIES: "registry.harbor.lan registry.flexinfer.ai"
  GATEWAY_IMAGE_REPO: mcp/fi-mcp-gateway
  # Central BuildKit endpoint — same as services/loom-core. The pod has
  # Harbor push credentials baked in cluster-side, so we don't need
  # HARBOR_USERNAME / HARBOR_PASSWORD CI variables (which had been broken
  # since at least pipeline #8378 on 2026-05-07).
  BUILDKIT_HOST: "tcp://buildkitd-central.ci-build.svc.cluster.local:1234"
  BUILDKIT_CLI_IMAGE: "registry.harbor.lan/dockerhub-cache/moby/buildkit:v0.12.5"

stages: [lint, test, build, deploy]

lint:
  extends: .go-lint
  image: golang:1.25.5
  before_script:
    - mkdir -p "$GOPATH" "$GOCACHE"
  script:
    - GOFLAGS=-mod=vendor go vet ./...

test:
  extends: .go-test
  image: golang:1.25.5
  before_script:
    - mkdir -p "$GOPATH" "$GOCACHE"
  variables:
    CGO_ENABLED: "1"
  script:
    - GOFLAGS=-mod=vendor go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
    - go install github.com/boumenot/gocover-cobertura@v1.4.0
    - $(go env GOPATH)/bin/gocover-cobertura < coverage.out > coverage.xml
    - GOFLAGS=-mod=vendor go tool cover -func=coverage.out

# Detects when a vendored upstream config schema (pkg/validator/schemas/)
# lags the live vendor copy — a stale schema emits false "additionalProperties
# not allowed" WARNs on every downstream config regen (loom sync). Non-blocking
# (allow_failure) because upstream can change at any time, independent of the
# commit under test. Scoped to codex; extend args as other schemas stabilize.
schema-drift:codex:
  stage: test
  image: golang:1.25.5
  allow_failure: true
  before_script:
    - mkdir -p "$GOPATH" "$GOCACHE"
  script:
    - GOFLAGS=-mod=vendor go run ./cmd/schema-drift codex
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - pkg/validator/schemas/**
        - cmd/schema-drift/**

build:cli:
  extends: .go-build
  image: golang:1.25.5
  before_script:
    - mkdir -p "$GOPATH" "$GOCACHE"
  script:
    - CGO_ENABLED=0 GOFLAGS=-mod=vendor go build -ldflags="-s -w" -o fi-mcp ./cmd/fi-mcp
  artifacts:
    paths:
      - fi-mcp
    expire_in: 1 week

build:image:fi-mcp-gateway:
  stage: deploy
  interruptible: true
  timeout: 60 minutes
  cache: []
  resource_group: "buildkit-fi-mcp-gateway-${CI_COMMIT_REF_SLUG}"
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  image:
    name: $BUILDKIT_CLI_IMAGE
    entrypoint: [""]
  variables:
    GIT_STRATEGY: fetch
    DOCKER_HOST: ""
  script:
    # Mirrors services/loom-core's image jobs: scripts/ci/buildkit-build.sh
    # builds via the central BuildKit, pushes :SHORT_SHA, :YYYYMMDD-HHMMSS
    # (timestamp), :latest (on default branch), and :CI_COMMIT_TAG (on tag).
    # The timestamp tag is what platform/gitops Flux ImagePolicy filters on
    # — k3s/flux/image-automation/fi-mcp-gateway-imagepolicy.yaml.
    - chmod +x scripts/ci/buildkit-build.sh
    - scripts/ci/buildkit-build.sh "$GATEWAY_IMAGE_REPO" Dockerfile.fi-mcp-gateway fi-mcp-gateway
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

radar-scan:
  extends: .radar-scan
